<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigaAM UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #111; color: #eee; }
    .card { background: #1b1b1b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    button { padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer; background: #333; color: #eee; }
    button:hover { background: #444; }
    button.primary { background: #2e7d32; }
    button.primary:hover { background: #388e3c; }
    button.danger { background: #8b2e2e; }
    button.danger:hover { background: #a33; }
    input[type=file] { margin-bottom: 12px; color: #eee; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0c0c0c; padding: 12px; border-radius: 8px; max-height: 400px; overflow: auto; }
    .progress { width: 100%; background: #333; border-radius: 8px; overflow: hidden; height: 18px; }
    .bar { height: 18px; width: 0%; background: #4caf50; transition: width .3s; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    a { color: #7cc4ff; }
    #fileList { list-style: none; padding: 0; margin: 12px 0; }
    #fileList li {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; margin-bottom: 6px;
      background: #252525; border-radius: 8px; cursor: grab;
    }
    #fileList li.dragging { opacity: 0.5; }
    #fileList li .name { flex: 1; }
    #fileList li .order-btns button { padding: 4px 8px; font-size: 12px; }
    .item-status { font-size: 12px; color: #aaa; }
    .item-bar { flex: 1; max-width: 120px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    .item-bar-fill { height: 8px; background: #4caf50; width: 0%; }
    .hint { color: #888; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GigaAM UI <small style="font-size:14px;color:#888">v2.0.0</small></h1>
    <div id="info">Loading...</div>
  </div>

  <div class="card">
    <h2>Распознавание</h2>
    <input type="file" id="fileInput" multiple accept="audio/*,video/*,.webm,.mp4,.mkv,.mov,.avi,.m4a,.mp3,.wav,.flac,.ogg">
    <p class="hint">Можно выбрать несколько аудио- и видеофайлов. Перетащите строки для изменения порядка.</p>
    <ul id="fileList"></ul>
    <div class="row">
      <button class="primary" onclick="startUpload(false)">Запустить (1 файл)</button>
      <button class="primary" onclick="startUpload(true)">Пакетная обработка</button>
      <button class="danger" onclick="clearWorkspace()">Очистить рабочий кэш</button>
      <button onclick="clearTarget('cache')">Очистить HF cache</button>
    </div>
    <p id="statusText">Ожидание</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <ul id="batchItems"></ul>
  </div>

  <div class="card">
    <h2>Результат</h2>
    <div id="downloads"></div>
    <pre id="result"></pre>
  </div>

<script>
let pollTimer = null;
let selectedFiles = [];
let dragIndex = null;

const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', () => {
  selectedFiles = Array.from(fileInput.files);
  renderFileList();
});

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  selectedFiles.forEach((file, idx) => {
    const li = document.createElement('li');
    li.draggable = true;
    li.dataset.index = idx;
    li.innerHTML = `
      <span class="name">${idx + 1}. ${file.name} (${formatSize(file.size)})</span>
      <span class="order-btns">
        <button type="button" onclick="moveFile(${idx}, -1)">↑</button>
        <button type="button" onclick="moveFile(${idx}, 1)">↓</button>
        <button type="button" onclick="removeFile(${idx})">✕</button>
      </span>`;
    li.addEventListener('dragstart', e => { dragIndex = idx; li.classList.add('dragging'); });
    li.addEventListener('dragend', () => { dragIndex = null; li.classList.remove('dragging'); });
    li.addEventListener('dragover', e => e.preventDefault());
    li.addEventListener('drop', e => {
      e.preventDefault();
      const target = parseInt(li.dataset.index, 10);
      if (dragIndex !== null && dragIndex !== target) {
        const moved = selectedFiles.splice(dragIndex, 1)[0];
        selectedFiles.splice(target, 0, moved);
        renderFileList();
      }
    });
    list.appendChild(li);
  });
}

function moveFile(idx, delta) {
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= selectedFiles.length) return;
  const tmp = selectedFiles[idx];
  selectedFiles[idx] = selectedFiles[newIdx];
  selectedFiles[newIdx] = tmp;
  renderFileList();
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderFileList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

async function loadInfo() {
  const res = await fetch('/api/info');
  const data = await res.json();
  document.getElementById('info').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
}

async function startUpload(batch) {
  if (!selectedFiles.length) {
    alert('Выберите хотя бы один файл');
    return;
  }
  if (!batch && selectedFiles.length > 1) {
    if (!confirm('Выбрано несколько файлов. Для пакетной обработки нажмите «Пакетная обработка». Продолжить только с первым файлом?')) {
      return;
    }
  }

  const form = new FormData();
  const files = batch ? selectedFiles : [selectedFiles[0]];
  files.forEach(f => form.append('files', f));
  form.append('order', JSON.stringify(files.map((_, i) => i)));

  document.getElementById('statusText').textContent = 'Загрузка файлов...';
  document.getElementById('bar').style.width = '1%';
  document.getElementById('result').textContent = '';
  document.getElementById('downloads').innerHTML = '';
  document.getElementById('batchItems').innerHTML = '';

  const url = batch ? '/api/batch' : '/api/transcribe';
  if (!batch) {
    const singleForm = new FormData();
    singleForm.append('file', selectedFiles[0]);
    const res = await fetch(url, { method: 'POST', body: singleForm });
    const data = await res.json();
    if (!data.job_id) {
      document.getElementById('statusText').textContent = JSON.stringify(data);
      return;
    }
    watchJob(data.job_id, false);
    return;
  }

  const res = await fetch(url, { method: 'POST', body: form });
  const data = await res.json();
  if (!data.job_id) {
    document.getElementById('statusText').textContent = JSON.stringify(data);
    return;
  }
  watchJob(data.job_id, true);
}

function watchJob(jobId, isBatch) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const res = await fetch('/api/status/' + jobId);
    const job = await res.json();
    document.getElementById('statusText').textContent = (job.stage || '') + ' | ' + (job.message || '');
    document.getElementById('bar').style.width = (job.progress || 0) + '%';

    if (isBatch && job.items) {
      const ul = document.getElementById('batchItems');
      ul.innerHTML = job.items.map((item, i) => `
        <li>
          <strong>${i + 1}. ${item.filename || 'file'}</strong>
          <span class="item-status">${item.stage || ''} | ${item.message || ''} (${item.progress || 0}%)</span>
          <div class="item-bar"><div class="item-bar-fill" style="width:${item.progress || 0}%"></div></div>
        </li>`).join('');
    }

    if (job.status === 'done') {
      clearInterval(pollTimer);
      const result = job.result || {};
      document.getElementById('result').textContent = result.text || '';
      renderDownloads(result.files || {}, isBatch, result.items || []);
    }
    if (job.status === 'error') {
      clearInterval(pollTimer);
      document.getElementById('result').textContent = (job.message || '') + '\n\n' + (job.traceback || '');
      document.getElementById('bar').style.width = '100%';
    }
  }, 1500);
}

function renderDownloads(files, isBatch, items) {
  let html = '<p>';
  if (files.txt) html += `<a href="/download/${files.txt}">TXT</a> | `;
  if (files.json) html += `<a href="/download/${files.json}">JSON</a> | `;
  if (files.srt) html += `<a href="/download/${files.srt}">SRT</a> | `;
  if (files.vtt) html += `<a href="/download/${files.vtt}">VTT</a> | `;
  if (files.zip) html += `<a href="/download/${files.zip}">ZIP (все)</a>`;
  html += '</p>';

  if (isBatch && items.length) {
    html += '<p><strong>Отдельные файлы:</strong></p><ul>';
    items.forEach(item => {
      const f = item.files || (item.result && item.result.files) || {};
      html += `<li>${item.filename}: `;
      if (f.txt) html += `<a href="/download/${f.txt}">TXT</a> `;
      if (f.srt) html += `<a href="/download/${f.srt}">SRT</a> `;
      if (f.vtt) html += `<a href="/download/${f.vtt}">VTT</a>`;
      html += '</li>';
    });
    html += '</ul>';
  }
  document.getElementById('downloads').innerHTML = html;
}

async function clearWorkspace() {
  if (!confirm('Очистить все загруженные файлы, результаты, временные данные и историю заданий? Модель GigaAM не будет удалена.')) return;
  const res = await fetch('/api/clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: 'workspace' })
  });
  const data = await res.json();
  if (res.status === 409) {
    alert('Очистка невозможна: идёт обработка файлов.');
    return;
  }
  alert(JSON.stringify(data, null, 2));
  selectedFiles = [];
  renderFileList();
  loadInfo();
}

async function clearTarget(target) {
  const res = await fetch('/api/clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target })
  });
  const data = await res.json();
  alert(JSON.stringify(data));
  loadInfo();
}

loadInfo();
</script>
</body>
</html>
