services:
  gigaam-ui:
    build: .
    container_name: gigaam-ui
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      MODEL_NAME: ${MODEL_NAME:-v3_e2e_rnnt}
      CHUNK_SECONDS: ${CHUNK_SECONDS:-20}
      MAX_FILE_MB: ${MAX_FILE_MB:-1000}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      JOB_TTL_CHECK_INTERVAL: ${JOB_TTL_CHECK_INTERVAL:-60}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 8000
    volumes:
      - ./data:/app/data
      - gigaam_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  gigaam_hf_cache:
